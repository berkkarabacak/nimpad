# Local development database. Matches the defaults in .env.example.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: nimpad
      POSTGRES_PASSWORD: nimpad
      POSTGRES_DB: nimpad
    ports:
      - "5432:5432"
    volumes:
      - nimpad-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nimpad -d nimpad"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  nimpad-db:
